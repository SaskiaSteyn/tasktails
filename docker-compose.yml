# TaskTails — Postgres for local development, plus the containerised app for the
# EC2 deployment (INF-01, INF-15).
#
# Two ways to use this file:
#
#   docker compose up -d db          # just the database, for `npm run dev`
#   docker compose --profile app up -d --build   # the whole stack, as deployed
#
# The app is behind a profile so the everyday `docker compose up -d` stays what
# it has always been — a database for the dev server to talk to — and nobody
# waits on an image build to run `npx prisma migrate dev`.
#
# The db credentials below are deliberately trivial and local-only. Nothing in
# this file is a secret: the app reads DATABASE_URL and AUTH_SECRET from the
# environment, and on EC2 those come from the instance, not from here (INF-16).
services:
  db:
    image: postgres:17-alpine
    container_name: tasktails-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasktails
      POSTGRES_PASSWORD: tasktails
      POSTGRES_DB: tasktails
    ports:
      - "5432:5432"
    volumes:
      - tasktails-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktails -d tasktails"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations, then exits. The app waits for it to
  # complete successfully, so a container can never serve against a schema older
  # than its code. `migrate deploy` only replays committed migrations — it never
  # generates or resets, so it is safe to run on every boot.
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrator
    container_name: tasktails-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tasktails:tasktails@db:5432/tasktails?schema=public}
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    build:
      context: .
      target: runner
    container_name: tasktails-app
    restart: unless-stopped
    ports:
      # Host port is overridable so the container can run alongside `npm run dev`,
      # which already holds 3000. The container always listens on 3000.
      - "${APP_PORT:-3000}:3000"
    environment:
      # Defaults point at the `db` service on the compose network. On EC2 every
      # one of these comes from the instance environment instead; see
      # .env.example for what each is and how to generate it.
      DATABASE_URL: ${DATABASE_URL:-postgresql://tasktails:tasktails@db:5432/tasktails?schema=public}
      # Required — put it in a `.env` beside this file, or export it. Generate
      # one with `npx auth secret`.
      #
      # Not `${AUTH_SECRET:?...}`: compose interpolates every service in the file
      # regardless of profile, so a required-variable marker here breaks plain
      # `docker compose up -d db` — the everyday dev command that has nothing to
      # do with this service. Left unset, the container still starts and serves
      # pages, but every auth request logs `MissingSecret` and sign-in is dead.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Absent by default; the "Continue with Google" button hides itself when
      # they are not set (see isGoogleEnabled in src/auth.ts).
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Behind a proxy or load balancer NextAuth cannot infer its own public
      # origin, and OAuth callbacks go to the wrong host without it.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  tasktails-db-data:
